[project]
name = "solution-architecture-mcp-toolkit"
version = "0.1.0"
description = "MCP-inspired tools for solution architecture workflows: ADRs, Well-Architected checks and threat models."
requires-python = ">=3.11"
authors = [{name = "Fernando Francisco Azevedo"}]

[project.scripts]
sa-toolkit = "sa_toolkit.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
